<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עדכון פרטים מהיר</title>
    <style>
        /* עיצוב בסיסי ומרכזי */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2, h3 { color: #333; margin-bottom: 25px; }

        /* עיצוב אזור החיפוש */
        .search-area { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }

        input[type="text"] {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            width: 60%;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus { border-color: #3498db; outline: none; }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-search { background-color: #3498db; color: white; }
        .btn-search:hover { background-color: #2980b9; }

        .btn-update {
            background-color: #2ecc71;
            color: white;
            width: 100%;
            margin-top: 25px;
            font-weight: bold;
        }
        .btn-update:hover { background-color: #27ae60; }
        button:active { transform: scale(0.98); }

        /* עיצוב הטופס הדינמי */
        #dynamicForm { text-align: right; border-top: 2px solid #eee; padding-top: 20px; }

        .field-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .dynamic-input { width: 100%; box-sizing: border-box; }
        .dynamic-input:disabled { background-color: #f9f9f9; color: #888; cursor: not-allowed; }

        /* אנימציית טעינה (Spinner) */
        #loading { display: none; margin: 20px auto; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>צפייה ועדכון פרטים אישיים</h2>
        
        <div class="search-area">
            <input type="text" id="idInput" placeholder="הכנס מספר זהות">
            <button class="btn-search" onclick="searchData()">חפש</button>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p style="color: #3498db;">טוען נתונים, אנא המתן...</p>
        </div>

        <div id="dynamicForm" style="display:none;">
            <h3>הפרטים שלך כפי שמופיעים במערכת:</h3>
            <div id="fieldsContainer"></div>
            <input type="hidden" id="rowNum">
            <input type="hidden" id="sheetName">
            <button class="btn-update" onclick="updateData()">עדכן את הפרטים שלי</button>
        </div>
    </div>

    <script>
        // --- חשוב מאוד: הדבק כאן את כתובת ה-Web App שקיבלת מגוגל ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwZDwVkOK3MzHq48hix8L5sf2lIotNTZMqgObNfWK05V2dYW2aUFSeN8OHtRUMG03RGuQ/exec'; 

        async function searchData() {
            const id = document.getElementById('idInput').value;
            if (!id) { alert("אנא הזן מספר זהות"); return; }

            // הצגת הספינר והסתרת הטופס הקודם
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dynamicForm').style.display = 'none';
            
            try {
                const response = await fetch(`${scriptURL}?id=${id}`);
                const result = await response.json();
                
                if (result.found) {
                    const container = document.getElementById('fieldsContainer');
                    container.innerHTML = ''; // ניקוי טופס קודם
                    
                    document.getElementById('rowNum').value = result.row;
                    document.getElementById('sheetName').value = result.sheetName;

                    // יצירת שדות קלט לכל עמודה בטבלה
                    let firstField = true;
                    for (let key in result.fields) {
                        if (key === "" || key.startsWith('_')) continue; // דילוג על עמודות ריקות או נסתרות

                        const div = document.createElement('div');
                        div.className = 'field-group';
                        
                        // השדה הראשון (מ.ז.) יהיה כבוי לעריכה
                        const isDisabled = firstField ? 'disabled' : '';
                        
                        div.innerHTML = `
                            <label>${key}</label>
                            <input type="text" class="dynamic-input" data-key="${key}" value="${result.fields[key]}" ${isDisabled}>
                        `;
                        container.appendChild(div);
                        firstField = false;
                    }
                    document.getElementById('dynamicForm').style.display = 'block';
                } else {
                    alert("מצטערים, מספר הזהות לא נמצא במערכת.");
                }
            } catch (e) { 
                console.error(e);
                alert("שגיאה בחיבור לשרת. ודא שכתובת הסקריפט נכונה ושהוא פורסם כראוי."); 
            }
            // הסתרת הספינר
            document.getElementById('loading').style.display = 'none';
        }

        async function updateData() {
            // ... (שאר הפונקציה נשארת כפי שהייתה בקוד הקודם) ...
            const updatedData = {};
            const inputs = document.querySelectorAll('#fieldsContainer input');
            inputs.forEach(input => {
                if (!input.disabled) {
                    updatedData[input.getAttribute('data-key')] = input.value;
                }
            });

            const payload = {
                row: document.getElementById('rowNum').value,
                sheetName: document.getElementById('sheetName').value,
                updatedData: updatedData
            };

            // הצגת טעינה בזמן העדכון
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dynamicForm').style.display = 'none';

            try {
                await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
                alert("הנתונים נשמרו בהצלחה!");
                location.reload(); // רענון הדף לסיום
            } catch(e) {
                alert("שגיאה בעדכון הנתונים.");
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dynamicForm').style.display = 'block';
            }
        }
    </script>
</body>
</html>
